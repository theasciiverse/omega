# Builds Omega for the Asciiverse catalog: one archive per target, named
# omega-<target>.tar.gz (.zip for Windows), plus a SHA256SUMS file, attached
# to a GitHub release (hub/catalog/SCHEMA.md, release.source = "github"),
# and .deb, .rpm, .apk and Arch packages from the Linux binaries (nfpm,
# asciiverse/nfpm.yaml). Runs on a v*-av.* tag, or by hand for an existing
# tag.
#
# Linux builds run in Alpine and link ncurses and the C++ library
# statically (-musl triples, nothing needed on the player's machine).
# macOS links the system ncurses. Windows builds upstream's console
# edition with MSVC and its PDCursesMod. A Windows failure does not hold
# back the release.

name: release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base cmake ncurses-dev ncurses-static &&
            STATIC=1 asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }} &&
            chown -R '"$(id -u):$(id -g)"' out stage dist'
          file out/omega

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH=${{ matrix.arch }}
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      # std::format needs libc++'s floating-point std::to_chars, in Apple's
      # libc++ from macOS 13.3 on
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} asciiverse/build.sh
          file out/omega
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          cmake -S . -B out/build -DPDC_GL_BUILD=OFF
          cmake --build out/build --config Release

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage/omega"
          New-Item -ItemType Directory -Force $stage, dist | Out-Null
          $exe = Get-ChildItem -Recurse out/build -Filter omega.exe | Select-Object -First 1
          Copy-Item $exe.FullName $stage/
          Copy-Item -Recurse lib $stage/lib
          Copy-Item COPYING, README.md, PATCHES.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath dist/omega-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Omega $TAG" \
                 --notes "Omega ${TAG%%-av.*} from Lyle Tafoya's Omega Rebirth (github.com/Lyle-Tafoya/Omega), built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
